# Columns whose value-tuple defines uniqueness. Defaults to the four mandatory MEDS
# event-row columns. Pipeline configs that carry additional columns (e.g.
# ``text_value`` from #182) should override ``by`` to include them, otherwise
# disagreements on those columns are silently collapsed.
by: null
# Behavior when rows in the same ``by`` group disagree on a non-``by`` column.
# - error (default): raise with an example offending group. Surfaces data-quality
#   issues rather than silently masking them.
# - first / last: keep the first / last row in source order.
# - drop: remove ALL rows in the disagreement group.
# True duplicates (rows that agree on every column) collapse to one row in every policy.
on_conflict: error
